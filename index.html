<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cosmi - Marketplace Beauté</title>
<style>
:root{--orange:#FF6A00;--dark:#111;--gray:#f7f7f7}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#fff}
.top{background:#111;color:#fff;padding:6px 12px;font-size:11px;display:flex;justify-content:space-between}
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #eee;display:flex;gap:10px;padding:10px 12px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px} .logo b{color:var(--orange)}
.search-wrap{flex:1;display:flex;max-width:600px;border:2px solid var(--orange);border-radius:24px;overflow:hidden}
.search-wrap input{flex:1;border:none;padding:12px 16px;outline:none}
.search-wrap button{background:var(--orange);border:none;color:#fff;padding:0 18px;font-weight:800}
.selects{display:flex;gap:6px} .selects select{padding:8px 10px;border-radius:20px;border:1px solid #ddd;font-size:12px}
.nav{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid #eee;position:sticky;top:58px;z-index:90;background:#fff}
.nav button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-weight:600;font-size:12px}
.nav button.active{background:var(--dark);color:#fff}
.hero{background:linear-gradient(90deg,#111,#333);color:#fff;padding:14px 12px;display:flex;justify-content:space-between}
.hero h1{font-size:16px;font-weight:800} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px;background:var(--gray)}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative}
.card img{width:100%;height:190px;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:9px;font-weight:800;padding:4px 8px;border-radius:8px}
.badge-sold{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:4px 6px;border-radius:8px}
.info{padding:10px} .cat{font-size:10px;color:#888;text-transform:uppercase} .name{font-size:13px;font-weight:700;height:36px;overflow:hidden;margin:4px 0}
.stars{font-size:10px;color:#FFA500} .price-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px} .price{font-weight:900;font-size:15px}
.wa{background:#25D366;color:#fff;border:none;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800}
.fab{position:fixed;bottom:18px;right:18px;background:var(--orange);color:#fff;width:56px;height:56px;border-radius:50%;border:none;font-size:28px;z-index:99}
.panel{padding:12px;display:none} .panel.active{display:block}
.form{max-width:500px;margin:0 auto;background:#fff;padding:16px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.form input,.form select{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0;font-size:13px}
.btn-main{width:100%;background:var(--orange);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;margin-top:8px}
</style>
</head>
<body>
<div class="top"><span>🌍 Livraison 195 pays</span><span id="countInfo"></span></div>
<header><div class="logo">Our <b>Cosmi</b></div><div class="search-wrap"><input id="search" placeholder="Rechercher perruque, crème..."><button id="btnSearch">🔍</button></div><div class="selects"><select id="countryFilter"></select><select id="contFilter"><option value="all">Tous</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></div></header>
<div class="nav" id="cats"><button class="active" data-cat="all">Tous</button><button data-cat="Perruque">Perruques</button><button data-cat="Crème">Crèmes</button><button data-cat="Parfum">Parfums</button><button data-cat="Maquillage">Makeup</button></div>
<div class="hero"><div><h1>Our Cosmi - Beauté Mondiale</h1><p>Perruques premium • Livraison Mauritanie & Monde</p></div><div style="text-align:right"><div style="font-weight:800">4.8/5 ★</div><div style="font-size:10px">WhatsApp: 41176023</div></div></div>
<div id="viewBuyer"><div class="grid" id="grid"></div></div>
<div id="viewSeller" class="panel"><div class="form"><h3 style="text-align:center">Devenir Vendeuse</h3><p style="font-size:11px;color:#666;text-align:center">Ton numéro sera affiché aux clients</p>
<input id="pName" placeholder="Nom ex: Perruque 18 pouces Brésilienne" required>
<div style="display:flex;gap:6px"><input id="pPrice" type="number" placeholder="Prix" required><select id="pCurrency" style="width:110px"><option>MRU</option><option>XOF</option><option>EUR €</option><option>USD $</option></select></div>
<select id="pCat"><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option></select>
<select id="pCountry"></select>
<input id="pVendor" placeholder="Nom boutique (ex: Fatou Beauty)" required>
<input id="pWa" placeholder="Ton WhatsApp (ex: 41176023) - ton numéro sera affiché" required>
<input type="file" id="pFile" accept="image/*" style="display:none">
<button type="button" onclick="document.getElementById('pFile').click()" style="width:100%;padding:10px;border-radius:10px;border:1px dashed #FF6A00;background:#fff7ed;margin:6px 0">📸 Ajouter ta photo produit</button>
<input id="pImg" placeholder="Lien photo (optionnel - auto si vide)">
<label style="display:flex;gap:8px;align-items:center;background:#fff7ed;padding:10px;border-radius:10px;margin:8px 0;font-size:12px"><input type="checkbox" id="pIsPub" style="width:18px"> <span><b>Sponsorisé 🔥 (en haut)</b></span></label>
<button id="btnPublish" class="btn-main">Publier avec MON numéro →</button>
<div id="myList" style="margin-top:16px"></div>
</div></div>
<button class="fab" id="fab">+</button>
<script>
const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"}];
const KEY="our_cosmi_V42_41176023_FINAL";
const PRO_IMAGES={
 Perruque:["https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=500","https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500","https://images.unsplash.com/photo-1580618672591-eb180b1a973f?w=500"],
 Crème:["https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=500","https://images.unsplash.com/photo-1571781926291-c477ebfd024b?w=500"],
 Parfum:["https://images.unsplash.com/photo-1541643600914-78b084683601?w=500","https://images.unsplash.com/photo-1594035910387-fea47794261f?w=500"],
 Maquillage:["https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=500"]
};
// TOUS LES NUMEROS MAURITANIE = 41176023
const defaults=[
{name:"Perruque Lace Frontal Brésilienne 18\" Naturelle",price:"5200 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou Beauty NKC",wa:"22241176023",img:PRO_IMAGES.Perruque[0],isPub:true,views:412,stars:4.9,sold:128},
{name:"Crème Éclaircissante Teint Diamant - Formule Pro",price:"45 EUR",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:PRO_IMAGES.Crème[0],isPub:true,views:298,stars:4.8,sold:89},
{name:"Parfum Oud Royal Dubaï - 100ml Original",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:PRO_IMAGES.Parfum[0],isPub:true,views:512,stars:5.0,sold:203},
{name:"Perruque Body Wave 22\" HD Lace",price:"7500 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Our Cosmi Officiel",wa:"22241176023",img:PRO_IMAGES.Perruque[1],isPub:false,views:124,stars:4.7,sold:56},
{name:"Crème Anti-Taches Visage - Our Cosmi Lab",price:"3500 MRU",cat:"Crème",country:"Mauritanie",flag:"🇲🇷",vendor:"Our Cosmi Lab",wa:"22241176023",img:PRO_IMAGES.Crème[1],isPub:false,views:76,stars:4.6,sold:34}
];
let items;
try{ let s=localStorage.getItem(KEY); items=s?JSON.parse(s):null; if(!items||items.length<2) throw "empty"; }catch(e){ items=[...defaults]; localStorage.setItem(KEY,JSON.stringify(items)); }
let tempImg=null;
const cf=document.getElementById("countryFilter"), pC=document.getElementById("pCountry");
function fillSel(){ cf.innerHTML='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join(''); pC.innerHTML=WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join(''); }
let activeCat="all";
function autoImg(name,cat,custom){
 if(tempImg) return tempImg;
 if(custom && custom.startsWith('http')) return custom;
 let pool=PRO_IMAGES[cat]||PRO_IMAGES.Perruque;
 if(cat==="Perruque"||name.toLowerCase().includes("perruque")) pool=PRO_IMAGES.Perruque;
 else if(cat==="Crème"||name.toLowerCase().includes("crème")) pool=PRO_IMAGES.Crème;
 else if(cat==="Parfum") pool=PRO_IMAGES.Parfum;
 return pool[Math.floor(Math.random()*pool.length)];
}
function render(){
 let list=[...items];
 if(activeCat!=="all") list=list.filter(i=>i.cat===activeCat);
 let term=document.getElementById("search").value.toLowerCase().trim();
 if(term){
  list=list.filter(i=>{
   let n=i.name.toLowerCase(), c=i.cat.toLowerCase();
   if(term.includes("perruq")||term.includes("wig")) return c==="perruque";
   if(term.includes("creme")||term.includes("crème")) return c==="crème";
   if(term.includes("parfum")||term.includes("oud")) return c==="parfum";
   return n.includes(term)||c.includes(term);
  });
 }
 let cval=cf.value; if(cval!=="all") list=list.filter(i=>i.country===cval);
 let cont=document.getElementById("contFilter").value; if(cont!=="all"){ list=list.filter(i=>{let w=WORLD.find(x=>x.name===i.country); return w&&w.cont===cont;});}
 list.sort((a,b)=>{ if(a.isPub&&!b.isPub) return -1; if(!a.isPub&&b.isPub) return 1; return b.sold-a.sold; });
 let grid=document.getElementById("grid"); grid.innerHTML="";
 if(list.length===0){ grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#999">Aucun résultat pour "${term}"</div>`; return; }
 list.forEach(p=>{
  let idx=items.indexOf(p);
  let div=document.createElement("div"); div.className="card";
  let displayNum = p.wa.replace("222",""); // affiche 41176023 sans 222
  div.innerHTML=`${p.isPub?'<div class="badge">SPONSORISÉ</div>':''}<div class="badge-sold">🔥 ${p.sold} vendus</div><img src="${p.img}"><div class="info"><div class="cat">${p.flag} ${p.country} • ${p.cat}</div><div class="name">${p.name}</div><div class="stars">★ ${p.stars} <span style="color:#666">(${p.sold}) • ${displayNum}</span></div><div class="price-row"><div class="price">${p.price}</div><button class="wa" onclick="openWa(${idx})">WhatsApp</button></div></div>`;
  grid.appendChild(div);
 });
 document.getElementById("countInfo").innerText=items.length+" produits";
 localStorage.setItem(KEY,JSON.stringify(items));
}
window.openWa=(i)=>{
 let p=items[i];
 // ICI : on utilise LE NUMERO DU VENDEUR qui a publié
 let cleanWa = p.wa.replace(/\D/g,'');
 if(cleanWa.length===8) cleanWa="222"+cleanWa; // si 41176023 → 22241176023 pour wa.me
 let txt=`Salam ${p.vendor} ! Je veux ${p.name} à ${p.price} sur Our Cosmi`;
 window.open(`https://wa.me/${cleanWa}?text=${encodeURIComponent(txt)}`,'_blank');
 p.views++; render();
};
fillSel();
document.querySelectorAll("#cats button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#cats button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); activeCat=b.dataset.cat; render();}));
cf.addEventListener("change",render); document.getElementById("contFilter").addEventListener("change",render);
document.getElementById("search").addEventListener("input",render);
document.getElementById("btnSearch").addEventListener("click",render);
document.getElementById("pFile").addEventListener("change",e=>{ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=ev=>{tempImg=ev.target.result; alert('✅ Photo ajoutée');}; r.readAsDataURL(f); });
document.getElementById("btnPublish").addEventListener("click",()=>{
 let name=document.getElementById("pName").value; if(!name) return alert("Nom produit");
 let price=document.getElementById("pPrice").value; if(!price) return alert("Prix");
 let waInput=document.getElementById("pWa").value.trim();
 if(!waInput) return alert("Mets ton WhatsApp");
 // NUMERO DU VENDEUR = celui qu'il tape
 let finalWa = waInput.replace(/\D/g,'');
 if(finalWa.length===8) finalWa="222"+finalWa; // 41176023 → 22241176023
 let np={name:name, price:price+" "+document.getElementById("pCurrency").value, cat:document.getElementById("pCat").value, country:pC.value, flag:WORLD.find(w=>w.name===pC.value)?.flag||"🇲🇷", vendor:document.getElementById("pVendor").value||"Vendeuse Our Cosmi", wa:finalWa, img:autoImg(name,document.getElementById("pCat").value,document.getElementById("pImg").value), isPub:document.getElementById("pIsPub").checked, views:15, stars:4.8, sold:0};
 items.unshift(np); tempImg=null; render(); alert('✅ Publié avec ton numéro: '+waInput+' ! Les clients te contacteront direct.'); document.getElementById("viewSeller").style.display="none"; document.getElementById("viewBuyer").style.display="block";
});
document.getElementById("fab").onclick=()=>{ document.getElementById("viewBuyer").style.display="none"; document.getElementById("viewSeller").style.display="block"; document.getElementById("viewSeller").classList.add("active"); };
render();
</script>
</body>
  </html>
