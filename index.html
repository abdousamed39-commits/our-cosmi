<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Our Cosmi WORLD</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff2e78"><style>:root{--rose:#ff2e78;--gold:#d4af37}body{margin:0;font-family:Arial;background:#fff8fb}header{position:sticky;top:0;background:#fff;display:flex;gap:8px;padding:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:100;flex-wrap:wrap}.logo{font-weight:900;font-size:20px;color:var(--rose)}.logo span{color:var(--gold)}select,input{padding:8px 12px;border-radius:20px;border:1px solid #ffd0e0;background:#fff;font-size:12px}.search{flex:1;min-width:120px}.hero{background:linear-gradient(135deg,#0f0f0f,#ff2e78,#d4af37);color:#fff;text-align:center;padding:25px}.hero h1{font-size:24px;margin:0}.filters{display:flex;gap:6px;overflow-x:auto;padding:10px}.fbtn{white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--rose);background:#fff;color:var(--rose);font-size:12px}.fbtn.active{background:var(--rose);color:#fff}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.06)}.card img{width:100%;height:150px;object-fit:cover}.card-body{padding:8px}.cat{font-size:9px;color:var(--gold);font-weight:700}.title{font-size:12px;font-weight:600;height:32px;overflow:hidden}.price{color:var(--rose);font-weight:800;font-size:12px}.wa{background:#25D366;color:#fff;border:none;padding:5px 10px;border-radius:12px;font-size:11px}.fab{position:fixed;bottom:15px;right:15px;background:var(--rose);color:#fff;width:56px;height:56px;border-radius:50%;border:none;font-size:26px;z-index:99}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:12px}.modal.active{display:flex}.box{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:16px;max-height:90vh;overflow:auto}.box input,.box select{width:100%;margin:5px 0}.box button[type=submit]{width:100%;background:var(--rose);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700}</style></head><body><header><div class="logo">Our Cosmi <span>WORLD</span></div><input id="search" class="search" placeholder="Chercher perruque..."><select id="countryFilter"></select><select id="contFilter"><option value="all">🌍 Monde</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></header><div class="hero"><h1>195 Pays. Une Beauté.</h1><p>De Nouakchott à Paris, Dubaï, New York</p></div><div class="filters"><button class="fbtn active" data-cat="all">Tout</button><button class="fbtn" data-cat="Perruque">Perruques</button><button class="fbtn" data-cat="Crème">Crèmes</button><button class="fbtn" data-cat="Parfum">Parfums</button><button class="fbtn" data-cat="Maquillage">Makeup</button></div><div class="products" id="grid"></div><button class="fab" id="fab">+</button><div class="modal" id="modal"><div class="box"><h3 style="text-align:center">Devenir Vendeuse 🌍</h3><form id="form"><input id="pName" placeholder="Nom produit" required><input id="pPrice" type="number" placeholder="Prix" required><select id="pCurrency" required><option>MRU</option><option>XOF</option><option>MAD</option><option>EUR €</option><option>USD $</option><option>AED</option></select><select id="pCat" required><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option><option>Naturel</option></select><select id="pCountry" required></select><input id="pVendor" placeholder="Nom boutique" required><input id="pWa" placeholder="WhatsApp +222..." required><input id="pImg" placeholder="Lien photo"><button type="submit">Publier ✈️</button><button type="button" id="close" style="width:100%;background:#eee;border:none;padding:10px;border-radius:10px;margin-top:6px">Annuler</button></form></div></div>
<script>const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Côte d'Ivoire",flag:"🇨🇮",cont:"Afrique"},{name:"Nigeria",flag:"🇳🇬",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"Algérie",flag:"🇩🇿",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"Espagne",flag:"🇪🇸",cont:"Europe"},{name:"Allemagne",flag:"🇩🇪",cont:"Europe"},{name:"UK",flag:"🇬🇧",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Canada",flag:"🇨🇦",cont:"Amérique"},{name:"Brésil",flag:"🇧🇷",cont:"Amérique"},{name:"Chine",flag:"🇨🇳",cont:"Asie"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"},{name:"Arabie",flag:"🇸🇦",cont:"Asie"},{name:"Turquie",flag:"🇹🇷",cont:"Asie"},{name:"Inde",flag:"🇮🇳",cont:"Asie"}];const KEY="cosmi_world_final";const defaults=[{name:"Perruque Brésilienne 22\"",price:"450 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou NKC",wa:"22246123456",img:"https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400"},{name:"Crème Teint Diamant",price:"45 €",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},{name:"Parfum Oud Dubaï",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"}];let items=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;const cf=document.getElementById("countryFilter"),pC=document.getElementById("pCountry");function fill(){const o='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');cf.innerHTML=o;pC.innerHTML='<option value="">Ton pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');}let activeCat="all";const grid=document.getElementById("grid");function render(){grid.innerHTML="";const term=document.getElementById("search").value.toLowerCase(),cval=cf.value,cont=document.getElementById("contFilter").value;items.filter(i=>{const mCat=activeCat==="all"||i.cat===activeCat;const mSearch=i.name.toLowerCase().includes(term);const mCountry=cval==="all"||i.country===cval;const w=WORLD.find(x=>x.name===i.country);const mCont=cont==="all"||cont==="🌍 Monde"||(w&&w.cont===cont);return mCat&&mSearch&&mCountry&&mCont;}).forEach(p=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${p.img}"><div class="card-body"><div class="cat">${p.flag} ${p.cat} • ${p.country}</div><div class="title">${p.name}</div><div style="font-size:10px;color:#888">${p.vendor}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px"><div class="price">${p.price}</div><button class="wa" onclick="window.open('https://wa.me/${p.wa}','_blank')">WhatsApp</button></div></div>`;grid.appendChild(d);});localStorage.setItem(KEY,JSON.stringify(items));}fill();document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render();}));cf.addEventListener("change",render);document.getElementById("contFilter").addEventListener("change",render);document.getElementById("search").addEventListener("input",render);document.getElementById("fab").onclick=()=>document.getElementById("modal").classList.add("active");document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("active");document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const cName=pC.value;const obj=WORLD.find(x=>x.name===cName)||{flag:"🌍"};items.unshift({name:pName.value,price:document.getElementById("pPrice").value+" "+document.getElementById("pCurrency").value,country:cName,flag:obj.flag,cat:document.getElementById("pCat").value,vendor:document.getElementById("pVendor").value,wa:document.getElementById("pWa").value.replace(/\s|\+/g,''),img:document.getElementById("pImg").value||defaults[0].img});render();e.target.reset();document.getElementById("modal").classList.remove("active");});render();</script></body></html>
