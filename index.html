<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cosmi - Le Marché Beauté de Mauritanie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#ff2e78;--gold:#d4af37;--dark:#1a1a1a;--bg:#fff8fb;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--dark)}
header{position:sticky;top:0;z-index:100;background:white;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:600;color:var(--rose)}
.logo span{color:var(--gold)}
.search-bar{flex:1;margin:0 15px;position:relative}
.search-bar input{width:100%;padding:10px 15px 10px 35px;border-radius:25px;border:1px solid #ffd0e0;background:#fff0f5}
.search-bar::before{content:'🔍';position:absolute;left:12px;top:10px}
.hero{background:linear-gradient(135deg,#ff2e78,#ffb86c);color:white;text-align:center;padding:40px 20px;border-radius:0 0 30px 30px}
.hero h1{font-family:'Playfair Display';font-size:32px}
.hero p{margin-top:8px;opacity:.9}
.filters{display:flex;gap:10px;overflow-x:auto;padding:15px 20px;scrollbar-width:none}
.filter-btn{white-space:nowrap;padding:8px 18px;border-radius:20px;border:1px solid var(--rose);background:white;color:var(--rose);font-weight:500;cursor:pointer}
.filter-btn.active{background:var(--rose);color:white}
.city-bar{padding:0 20px 10px;display:flex;gap:8px;flex-wrap:wrap}
.city-tag{font-size:12px;background:white;border:1px solid #eee;padding:5px 10px;border-radius:15px;cursor:pointer}
.city-tag.active{background:var(--dark);color:white}
.products{padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px;max-width:1200px;margin:auto}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:.2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px 12px}
.card-cat{font-size:10px;color:var(--gold);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.card-title{font-size:14px;font-weight:500;margin:3px 0;height:36px;overflow:hidden}
.card-vendor{font-size:11px;color:#888}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.card-price{color:var(--rose);font-weight:700}
.btn-wa{background:#25D366;color:white;border:none;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
.fab{position:fixed;bottom:20px;right:20px;background:var(--rose);color:white;width:60px;height:60px;border-radius:50%;border:none;font-size:30px;box-shadow:0 5px 20px rgba(255,46,120,.4);cursor:pointer;z-index:99}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.active{display:flex}
.modal-box{background:white;width:100%;max-width:400px;border-radius:20px;padding:20px}
.modal-box h3{text-align:center;margin-bottom:15px;font-family:'Playfair Display'}
.modal-box input,.modal-box select{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:1px solid #ddd}
.modal-box button[type=submit]{width:100%;background:var(--rose);color:white;border:none;padding:12px;border-radius:12px;margin-top:10px;font-weight:600}
</style>
</head>
<body>
<header>
<div class="logo">Our <span>Cosmi</span></div>
<div class="search-bar"><input id="search" placeholder="Perruque, crème, parfum..."></div>
<div style="font-size:12px">🇲🇷 Partout en MR</div>
</header>
<div class="hero">
<h1>La beauté Mauritanienne, en un seul endroit</h1>
<p>300+ vendeuses de Nouakchott à Zouerate • Livraison partout</p>
</div>
<div class="filters">
<button class="filter-btn active" data-cat="all">Tout</button>
<button class="filter-btn" data-cat="Perruque">Perruques</button>
<button class="filter-btn" data-cat="Crème">Crèmes & Lait</button>
<button class="filter-btn" data-cat="Parfum">Parfums</button>
<button class="filter-btn" data-cat="Maquillage">Maquillage</button>
<button class="filter-btn" data-cat="Naturel">Naturel / Touba</button>
</div>
<div class="city-bar">
<span class="city-tag active" data-city="all">📍 Toute la Mauritanie</span>
<span class="city-tag" data-city="Nouakchott">Nouakchott</span>
<span class="city-tag" data-city="Nouadhibou">Nouadhibou</span>
<span class="city-tag" data-city="Rosso">Rosso</span>
<span class="city-tag" data-city="Kaedi">Kaédi</span>
<span class="city-tag" data-city="Zouerate">Zouerate</span>
</div>
<div class="products" id="products"></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal">
<div class="modal-box">
<h3>Ajouter ton produit 💄</h3>
<form id="addForm">
<input id="pName" placeholder="Nom du produit (ex: Perruque Brésilienne)" required>
<input id="pPrice" type="number" placeholder="Prix en MRU" required>
<select id="pCat" required><option value="">Catégorie</option><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option><option>Naturel</option></select>
<select id="pCity" required><option value="">Ta ville</option><option>Nouakchott</option><option>Nouadhibou</option><option>Rosso</option><option>Kaedi</option><option>Zouerate</option><option>Atar</option><option>Kiffa</option><option>Néma</option></select>
<input id="pVendor" placeholder="Nom de ta boutique / ton nom" required>
<input id="pWa" placeholder="Ton WhatsApp (ex: 46 12 34 56)" required>
<input id="pImg" placeholder="Lien photo (ou laisse vide = image auto)" >
<button type="submit">Publier sur Our Cosmi ✨</button>
<button type="button" id="closeModal" style="width:100%;background:#eee;border:none;padding:10px;border-radius:10px;margin-top:8px">Annuler</button>
</form>
</div>
</div>
<script>
const KEY="ourcosmi_v1";
const defaultItems=[
{name:"Perruque Lace Front Naturelle",price:4500,cat:"Perruque",city:"Nouakchott",vendor:"Fatou Beauty",wa:"22246123456",img:"https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400"},
{name:"Lait Éclaircissant Touba Bio",price:800,cat:"Crème",city:"Kaedi",vendor:"Aminata Nature",wa:"22247123456",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},
{name:"Parfum Dubaï Oud Royal",price:1200,cat:"Parfum",city:"Nouadhibou",vendor:"Zahra Parfums",wa:"22248123456",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"},
{name:"Makeup Kit Complet 24pcs",price:2500,cat:"Maquillage",city:"Rosso",vendor:"Boutique Rosso Glam",wa:"22249123456",img:"https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=400"},
{name:"Huile Pousse Cheveux",price:600,cat:"Naturel",city:"Zouerate",vendor:"Sahra Bio",wa:"22240123456",img:"https://images.unsplash.com/photo-1608248597279-f99d160bfcbc?w=400"},
{name:"Perruque Bouclée 14 pouces",price:3800,cat:"Perruque",city:"Nouakchott",vendor:"Coiffure Mariem",wa:"22245123456",img:"https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400"},
];
let items = JSON.parse(localStorage.getItem(KEY) || "null") || defaultItems;
let activeCat="all", activeCity="all";
const grid=document.getElementById("products");
const render=()=>{
  grid.innerHTML="";
  const term=document.getElementById("search").value.toLowerCase();
  items.filter(i=>(activeCat==="all"||i.cat===activeCat)&&(activeCity==="all"||i.city===activeCity)&&(i.name.toLowerCase().includes(term)||i.vendor.toLowerCase().includes(term))).forEach(p=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=400'"><div class="card-body"><div class="card-cat">${p.cat} • ${p.city}</div><div class="card-title">${p.name}</div><div class="card-vendor">par ${p.vendor}</div><div class="card-footer"><div class="card-price">${p.price} MRU</div><button class="btn-wa" onclick="window.open('https://wa.me/${p.wa}?text=Salam, je veux ${encodeURIComponent(p.name)} sur Our Cosmi','_blank')">WhatsApp</button></div></div>`;
    grid.appendChild(d);
  });
  localStorage.setItem(KEY,JSON.stringify(items));
};
document.querySelectorAll(".filter-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render();}));
document.querySelectorAll(".city-tag").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".city-tag").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCity=b.dataset.city;render();}));
document.getElementById("search").addEventListener("input",render);
document.getElementById("fab").onclick=()=>document.getElementById("modal").classList.add("active");
document.getElementById("closeModal").onclick=()=>document.getElementById("modal").classList.remove("active");
document.getElementById("addForm").addEventListener("submit",e=>{
  e.preventDefault();
  const img=document.getElementById("pImg").value || `https://images.unsplash.com/photo-${["1590156546946-ce55a12a6a5d","1556228578-0d85b1a4d571","1541643600914-78b084683601"][Math.floor(Math.random()*3)]}?w=400`;
  items.unshift({name:pName.value,price:Number(pPrice.value),cat:pCat.value,city:pCity.value,vendor:pVendor.value,wa:pWa.value.replace(/\s/g,''),img});
  render();e.target.reset();document.getElementById("modal").classList.remove("active");
  alert("Mabrouk ! Ton produit est en ligne sur Our Cosmi ✨");
});
render();
</script>
</body>
  </html>
