<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUR COSMI WORLD - 195 Pays</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyAJQMIVjOA8TrQw9RDvWr_tuKbzVtaSS0I",
  authDomain: "our-cosmi-world.firebaseapp.com",
  projectId: "our-cosmi-world",
  storageBucket: "our-cosmi-world.firebasestorage.app",
  messagingSenderId: "363231617261",
  appId: "1:363231617261:web:53a5cb6ef59b98a0a8ece4",
  measurementId: "G-G2V2FTQ9SJ"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.db=db; window.collection=collection; window.addDoc=addDoc; window.onSnapshot=onSnapshot; window.query=query; window.orderBy=orderBy; window.serverTimestamp=serverTimestamp;
</script>
</head>
<body class="bg-[#f8f7ff] min-h-screen">
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-9 h-9 rounded-xl bg-violet-600 flex items-center justify-center text-white font-black">O</div><div><h1 class="font-black text-sm">OUR COSMI WORLD</h1><p class="text-[10px] text-violet-600 font-bold">195 PAYS LIVE</p></div></div>
<button onclick="document.getElementById('addModal').classList.remove('hidden')" class="bg-black text-white px-5 py-2.5 rounded-full font-bold text-sm">+ Vendre</button>
</div>
</header>
<div class="max-w-7xl mx-auto px-4 py-4">
<div class="bg-gradient-to-r from-violet-600 to-indigo-600 rounded-[24px] p-6 text-white"><h2 class="text-2xl font-black">Marketplace Mondial Gratuit</h2><p class="text-white/80 text-sm mt-2">Publie → visible dans 195 pays en 1 seconde</p><div class="mt-3"><span class="bg-white text-violet-700 px-3 py-1 rounded-full text-xs font-bold"><span id="count">0</span> produits live</span></div></div>
<div class="mt-4 flex gap-2 overflow-x-auto"><input id="search" placeholder="🔍 Chercher..." class="flex-1 min-w-[140px] bg-white border rounded-full px-4 py-2.5 text-sm"><select id="countryFilter" class="bg-white border rounded-full px-4 py-2.5 text-sm font-bold"><option value="">🌍 Tous pays</option></select><select id="catFilter" class="bg-white border rounded-full px-4 py-2.5 text-sm font-bold"><option value="">📦 Catégorie</option><option>Mode</option><option>Electronique</option><option>Beauté</option><option>Alimentation</option><option>Artisanat</option><option>Services</option><option>Autre</option></select></div>
<div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5"><div class="col-span-full text-center py-20 text-gray-400">Chargement des produits du monde...</div></div>
</div>
<div id="addModal" class="hidden fixed inset-0 z-[60] bg-black/60 flex items-end md:items-center justify-center p-0 md:p-4"><div class="bg-white w-full md:max-w-lg rounded-t-[28px] md:rounded-[28px] p-6 max-h-[90vh] overflow-y-auto"><div class="flex justify-between mb-4"><h3 class="font-black text-xl">Publier produit</h3><button onclick="document.getElementById('addModal').classList.add('hidden')" class="w-8 h-8 bg-gray-100 rounded-full">X</button></div><form id="productForm" class="space-y-3"><input id="pName" required placeholder="Nom produit *" class="w-full border rounded-xl px-4 py-3 text-sm"><div class="grid grid-cols-2 gap-3"><input id="pPrice" required type="number" placeholder="Prix MRU *" class="border rounded-xl px-4 py-3 text-sm"><select id="pCountry" required class="border rounded-xl px-4 py-3 text-sm"></select></div><select id="pCat" required class="w-full border rounded-xl px-4 py-3 text-sm"><option value="">Catégorie *</option><option>Mode</option><option>Electronique</option><option>Beauté</option><option>Alimentation</option><option>Artisanat</option><option>Services</option><option>Autre</option></select><input id="pImage" placeholder="Lien image https://..." class="w-full border rounded-xl px-4 py-3 text-sm"><input id="pWhatsApp" required placeholder="WhatsApp +222..." class="w-full border rounded-xl px-4 py-3 text-sm"><textarea id="pDesc" placeholder="Description courte" class="w-full border rounded-xl px-4 py-3 text-sm h-20"></textarea><button type="submit" id="submitBtn" class="w-full bg-black text-white rounded-full py-4 font-black">🚀 PUBLIER DANS 195 PAYS</button></form></div></div>
<script type="module">
const allCountries = ["Afghanistan","Afrique du Sud","Albanie","Algérie","Allemagne","Andorre","Angola","Antigua-et-Barbuda","Arabie Saoudite","Argentine","Arménie","Australie","Autriche","Azerbaïdjan","Bahamas","Bahreïn","Bangladesh","Barbade","Belgique","Belize","Bénin","Bhoutan","Biélorussie","Birmanie","Bolivie","Bosnie-Herzégovine","Botswana","Brésil","Brunei","Bulgarie","Burkina Faso","Burundi","Cambodge","Cameroun","Canada","Cap-Vert","Centrafrique","Chili","Chine","Chypre","Colombie","Comores","Congo","Congo (RDC)","Corée du Nord","Corée du Sud","Costa Rica","Côte d'Ivoire","Croatie","Cuba","Danemark","Djibouti","Dominique","Égypte","Émirats Arabes Unis","Équateur","Érythrée","Espagne","Eswatini","Estonie","États-Unis","Éthiopie","Fidji","Finlande","France","Gabon","Gambie","Géorgie","Ghana","Grèce","Grenade","Guatemala","Guinée","Guinée-Bissau","Guinée équatoriale","Guyana","Haïti","Honduras","Hongrie","Inde","Indonésie","Irak","Iran","Irlande","Islande","Israël","Italie","Jamaïque","Japon","Jordanie","Kazakhstan","Kenya","Kirghizistan","Kiribati","Koweït","Laos","Lesotho","Lettonie","Liban","Libéria","Libye","Liechtenstein","Lituanie","Luxembourg","Macédoine du Nord","Madagascar","Malaisie","Malawi","Maldives","Mali","Malte","Maroc","Marshall","Maurice","Mauritanie","Mexique","Micronésie","Moldavie","Monaco","Mongolie","Monténégro","Mozambique","Namibie","Nauru","Népal","Nicaragua","Niger","Nigeria","Norvège","Nouvelle-Zélande","Oman","Ouganda","Ouzbékistan","Pakistan","Palaos","Palestine","Panama","Papouasie-Nouvelle-Guinée","Paraguay","Pays-Bas","Pérou","Philippines","Pologne","Portugal","Qatar","Roumanie","Royaume-Uni","Russie","Rwanda","Saint-Kitts-et-Nevis","Saint-Marin","Saint-Vincent-et-les-Grenadines","Sainte-Lucie","Salomon","Salvador","Samoa","São Tomé-et-Principe","Sénégal","Serbie","Seychelles","Sierra Leone","Singapour","Slovaquie","Slovénie","Somalie","Soudan","Soudan du Sud","Sri Lanka","Suède","Suisse","Suriname","Syrie","Tadjikistan","Tanzanie","Tchad","Tchéquie","Thaïlande","Timor oriental","Togo","Tonga","Trinité-et-Tobago","Tunisie","Turkménistan","Turquie","Tuvalu","Ukraine","Uruguay","Vanuatu","Vatican","Venezuela","Viêt Nam","Yémen","Zambie","Zimbabwe"];
const pCountry=document.getElementById('pCountry'); const countryFilter=document.getElementById('countryFilter');
allCountries.sort().forEach(c=>{let o1=document.createElement('option');o1.value=c;o1.textContent=c;pCountry.appendChild(o1);let o2=document.createElement('option');o2.value=c;o2.textContent=c;countryFilter.appendChild(o2);});
pCountry.value="Mauritanie";
const productsCol = collection(db,"products"); let allProducts=[];
const q = query(productsCol, orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{allProducts=[];snap.forEach(d=>allProducts.push({id:d.id,...d.data()}));document.getElementById('count').textContent=allProducts.length;render();});
function render(){const search=document.getElementById('search').value.toLowerCase();const cf=document.getElementById('countryFilter').value;const catf=document.getElementById('catFilter').value;let filtered=allProducts.filter(p=>{if(search&&!((p.name||'').toLowerCase().includes(search)||(p.desc||'').toLowerCase().includes(search)))return false;if(cf&&p.country!==cf)return false;if(catf&&p.category!==catf)return false;return true;});const container=document.getElementById('products');if(filtered.length===0){container.innerHTML='<div class="col-span-full text-center py-16"><p class="text-4xl">🌍</p><p class="font-bold mt-2">Aucun produit</p><button onclick="document.getElementById(\'addModal\').classList.remove(\'hidden\')" class="mt-4 bg-violet-600 text-white px-6 py-2 rounded-full text-sm font-bold">Publier maintenant</button></div>';return;}container.innerHTML=filtered.map(p=>`<div class="bg-white rounded-[18px] border overflow-hidden"><div class="aspect-square bg-gray-100 relative"><img src="${p.image||'https://via.placeholder.com/400?text='+encodeURIComponent(p.name)}" class="w-full h-full object-cover"><span class="absolute top-2 left-2 bg-black text-white text-[10px] px-2 py-1 rounded-full font-bold">${p.country||''}</span><span class="absolute top-2 right-2 bg-violet-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">${p.category||''}</span></div><div class="p-3"><h3 class="font-bold text-[13px] truncate">${p.name}</h3><p class="text-[11px] text-gray-500 line-clamp-2 mt-1">${p.desc||''}</p><div class="flex justify-between items-center mt-2"><span class="font-black text-sm">${p.price} MRU</span><a href="https://wa.me/${(p.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" class="bg-green-500 text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fab fa-whatsapp text-sm"></i></a></div></div></div>`).join('');}
document.getElementById('search').addEventListener('input',render);document.getElementById('countryFilter').addEventListener('change',render);document.getElementById('catFilter').addEventListener('change',render);
document.getElementById('productForm').addEventListener('submit',async(e)=>{e.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Publication...';try{await addDoc(productsCol,{name:document.getElementById('pName').value.trim(),price:Number(document.getElementById('pPrice').value),country:pCountry.value,category:document.getElementById('pCat').value,image:document.getElementById('pImage').value.trim(),whatsapp:document.getElementById('pWhatsApp').value.trim(),desc:document.getElementById('pDesc').value.trim(),createdAt:serverTimestamp()});e.target.reset();pCountry.value="Mauritanie";document.getElementById('addModal').classList.add('hidden');alert('✅ Publié ! Visible dans 195 pays !');}catch(err){alert('Erreur: '+err.message);}btn.disabled=false;btn.textContent='🚀 PUBLIER DANS 195 PAYS';});
</script>
</body>
                                                                                                                                             </html>
