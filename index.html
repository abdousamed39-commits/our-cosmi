<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cosmi WORLD - 195 Pays</title>
<style>
:root{--bg:#FAF8F5;--paper:#FFF;--ink:#141414;--gold:#B89B5E;--gold2:#E8DCC2;--line:#EDE8E0}
*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:Poppins,Arial}
header{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--gold)}
.logo{font-weight:900;letter-spacing:1.5px;font-size:18px}.logo b{color:var(--gold)}.logo i{font-weight:300;opacity:.8;font-size:12px;letter-spacing:3px;margin-left:8px}
header input,header select{background:#1E1E1E;border:1px solid #2A2A2A;color:#fff;border-radius:30px;padding:10px 14px;font-size:12px;outline:none}
header input{flex:1;min-width:140px}
.hero{background:linear-gradient(180deg,#141414,#2A2220);color:#fff;text-align:center;padding:38px 20px 32px}
.hero h1{font-size:28px;letter-spacing:2px;font-weight:300}.hero h1 span{font-weight:700;color:var(--gold)}.hero p{margin-top:8px;color:var(--gold2);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:50}
.fbtn{white-space:nowrap;border-radius:30px;padding:8px 18px;border:1px solid var(--line);background:var(--paper);font-size:12px;cursor:pointer}.fbtn.active{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;padding:16px}
.card{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 4px 20px rgba(20,20,20,.04)}
.card img{width:100%;height:180px;object-fit:cover;background:#f5f5f5}
.card-body{padding:12px 14px 14px}.cat{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.title{font-size:13px;font-weight:600;margin:4px 0;height:36px;overflow:hidden;line-height:18px}
.vendor{font-size:10px;color:#999}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-weight:800;font-size:13px}.wa{background:var(--ink);color:var(--gold);border:1px solid var(--ink);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600}
.fab{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--gold);width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);font-size:28px;z-index:90}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}.modal.active{display:flex}
.box{background:var(--bg);width:100%;max-width:420px;border-radius:24px;padding:20px;border:1px solid var(--line);max-height:92vh;overflow:auto}
.box input,.box select{width:100%;margin:6px 0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px}
.box button[type=submit]{width:100%;background:var(--ink);color:var(--gold);border:none;padding:14px;border-radius:14px;font-weight:700;margin-top:8px}
.badge{background:var(--gold);color:#141414;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;position:fixed;top:70px;right:16px;z-index:60}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyAJQMIVjOA8TrQw9RDvWr_tuKbzVtaSS0I",authDomain:"our-cosmi-world.firebaseapp.com",projectId:"our-cosmi-world",storageBucket:"our-cosmi-world.firebasestorage.app",messagingSenderId:"363231617261",appId:"1:363231617261:web:53a5cb6ef59b98a0a8ece4"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
window.db=db; window.collection=collection; window.addDoc=addDoc; window.onSnapshot=onSnapshot; window.query=query; window.orderBy=orderBy; window.serverTimestamp=serverTimestamp;
</script>
</head>
<body>
<div class="badge" id="countBadge">0 PRODUITS LIVE • 195 PAYS</div>
<header><div class="logo">OUR <b>COSMI</b> <i>WORLD</i></div><input id="search" placeholder="Perruque, crème, parfum..."><select id="countryFilter"></select><select id="contFilter"><option value="all">🌍 Monde</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></header>
<div class="hero"><h1>195 PAYS. <span>UNE BEAUTÉ.</span></h1><p>VERA COSMIQUE • De Nouakchott à Paris • Dubaï • New York • LIVE</p></div>
<div class="filters"><button class="fbtn active" data-cat="all">Tout</button><button class="fbtn" data-cat="Perruque">Perruques</button><button class="fbtn" data-cat="Crème">Crèmes</button><button class="fbtn" data-cat="Naturel">VERA Naturel</button><button class="fbtn" data-cat="Parfum">Parfums</button><button class="fbtn" data-cat="Maquillage">Makeup</button></div>
<div class="products" id="grid"></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="box"><h3 style="font-weight:900;margin-bottom:12px">DEVENIR VENDEUSE - 195 PAYS</h3><form id="form"><input id="pName" placeholder="Nom produit *" required><input id="pPrice" type="number" placeholder="Prix *" required><select id="pCurrency" required><option>MRU</option><option>EUR €</option><option>USD $</option><option>AED</option><option>XOF</option><option>MAD</option></select><select id="pCat" required><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option><option>Naturel</option></select><select id="pCountry" required></select><input id="pVendor" placeholder="Nom boutique *" required><input id="pWa" placeholder="WhatsApp +222... *" required><input id="pImg" placeholder="Lien photo https://..."><button type="submit" id="submitBtn">🚀 PUBLIER DANS 195 PAYS</button><button type="button" id="close" style="width:100%;background:transparent;border:1px solid #EDE8E0;padding:12px;border-radius:14px;margin-top:8px">Annuler</button></form></div></div>
<script type="module">
const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Côte d'Ivoire",flag:"🇨🇮",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"Nigeria",flag:"🇳🇬",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"Espagne",flag:"🇪🇸",cont:"Europe"},{name:"UK",flag:"🇬🇧",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Brésil",flag:"🇧🇷",cont:"Amérique"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"},{name:"Turquie",flag:"🇹🇷",cont:"Asie"},{name:"Chine",flag:"🇨🇳",cont:"Asie"}];
const defaults=[
{name:"VERA COSMIQUE Aloe Vera Serum 250ml",price:"120 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22241176023",img:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=400"},
{name:"VERA COSMIQUE Aloe Vera Luxe 500ml",price:"210 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22241176023",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},
{name:"VERA COSMIQUE Nourish & Repair Duo",price:"300 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22241176023",img:"https://images.unsplash.com/photo-1617897903246-719242758050?w=400"},
{name:"Perruque Brésilienne 22\"",price:"4500 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou NKC",wa:"22246123456",img:"https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400"},
{name:"Crème Teint Diamant",price:"45 €",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:"https://images.unsplash.com/photo-1617897903246-719242758050?w=400"},
{name:"Parfum Oud Dubaï",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"},
{name:"Perruque Lace Frontal 18\"",price:"3800 MRU",cat:"Perruque",country:"Sénégal",flag:"🇸🇳",vendor:"Mariam Dakar",wa:"221771234567",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400"},
{name:"Huile Argan Pure Maroc",price:"250 MAD",cat:"Crème",country:"Maroc",flag:"🇲🇦",vendor:"Leila Marrakech",wa:"212612345678",img:"https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?w=400"},
{name:"Rouge à Lèvres Matte Velvet",price:"28 €",cat:"Maquillage",country:"France",flag:"🇫🇷",vendor:"Belle Paris",wa:"33698765432",img:"https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=400"},
{name:"Perruque Afro Curly 20\"",price:"5200 MRU",cat:"Perruque",country:"Nigeria",flag:"🇳🇬",vendor:"Chioma Lagos",wa:"2348012345678",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400"},
{name:"Fond de Teint Invisible HD",price:"32 $",cat:"Maquillage",country:"USA",flag:"🇺🇸",vendor:"Glow NY",wa:"12125551234",img:"https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400"},
{name:"Parfum Chanel N°5",price:"95 €",cat:"Parfum",country:"France",flag:"🇫🇷",vendor:"Chic Paris",wa:"33611223344",img:"https://images.unsplash.com/photo-1543422655-ac1c6ca993c3?w=400"},
{name:"Crème Hydra Rose",price:"180 MRU",cat:"Crème",country:"Mauritanie",flag:"🇲🇷",vendor:"Our Cosmi",wa:"22246123456",img:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=400"},
{name:"Mascara Volume Noir",price:"22 €",cat:"Maquillage",country:"Espagne",flag:"🇪🇸",vendor:"Luna Madrid",wa:"34911223344",img:"https://images.unsplash.com/photo-1631214524020-7e84f0d84a6c?w=400"},
{name:"Savon Noir Naturel",price:"200 MRU",cat:"Crème",country:"Mauritanie",flag:"🇲🇷",vendor:"Bio NKC",wa:"22247123456",img:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=400"},
{name:"Perruque Blonde 24\"",price:"6500 MRU",cat:"Perruque",country:"Brésil",flag:"🇧🇷",vendor:"Samba Hair",wa:"5511987654321",img:"https://images.unsplash.com/photo-1500917293891-ef795e70e1f6?w=400"},
{name:"Parfum Musc Blanc Dubaï",price:"150 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Noor Dubai",wa:"971501111222",img:"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400"},
{name:"Palette Maquillage Nude",price:"55 $",cat:"Maquillage",country:"USA",flag:"🇺🇸",vendor:"Glam LA",wa:"13105551234",img:"https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=400"}
];
const cf=document.getElementById("countryFilter"),pC=document.getElementById("pCountry");
function fill(){const o='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');cf.innerHTML=o;pC.innerHTML='<option value="">Ton pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');}
let activeCat="all"; const grid=document.getElementById("grid");
let firebaseProducts=[]; let useFirebase=false;
const productsCol = collection(db,"products");
const q = query(productsCol, orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{
  firebaseProducts=[];
  snap.forEach(d=>{let data=d.data(); firebaseProducts.push({name:data.name, price:data.price+" "+(data.currency||"MRU"), cat:data.category, country:data.country, flag:WORLD.find(w=>w.name==data.country)?.flag||"🌍", vendor:data.desc||data.whatsapp, wa:data.whatsapp, img:data.image||"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=400"})});
  if(firebaseProducts.length>0){useFirebase=true; document.getElementById("countBadge").textContent=firebaseProducts.length+" PRODUITS LIVE • 195 PAYS";}
  render();
});
function getItems(){ return useFirebase ? firebaseProducts : defaults; }
function render(){
  let items=getItems();
  grid.innerHTML=""; const term=document.getElementById("search").value.toLowerCase(),cval=cf.value,cont=document.getElementById("contFilter").value;
  items.filter(i=>{const mCat=activeCat==="all"||i.cat===activeCat;const mSearch=i.name.toLowerCase().includes(term);const mCountry=cval==="all"||i.country===cval;const w=WORLD.find(x=>x.name===i.country);const mCont=cont==="all"||cont==="🌍 Monde"||(w&&w.cont===cont);return mCat&&mSearch&&mCountry&&mCont;}).forEach(p=>{
    const d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=400'"><div class="card-body"><div class="cat">${p.flag} ${p.cat} • ${p.country}</div><div class="title">${p.name}</div><div class="vendor">${p.vendor}</div><div class="bottom"><div class="price">${p.price}</div><button class="wa" onclick="window.open('https://wa.me/${p.wa}','_blank')">WhatsApp</button></div></div>`;grid.appendChild(d);
  });
  if(!useFirebase){document.getElementById("countBadge").textContent=defaults.length+" PRODUITS • MODE DEMO"}
}
fill();
document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render();}));
cf.addEventListener("change",render);document.getElementById("contFilter").addEventListener("change",render);document.getElementById("search").addEventListener("input",render);
document.getElementById("fab").onclick=()=>document.getElementById("modal").classList.add("active");document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("active");
document.getElementById("form").addEventListener("submit",async(e)=>{
  e.preventDefault(); const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="Publication...";
  try{
    const priceVal=document.getElementById("pPrice").value;
    const cur=document.getElementById("pCurrency").value;
    await addDoc(productsCol,{name:document.getElementById("pName").value,price:Number(priceVal),currency:cur,country:pC.value,category:document.getElementById("pCat").value,image:document.getElementById("pImg").value,whatsapp:document.getElementById("pWa").value,desc:document.getElementById("pVendor").value,createdAt:serverTimestamp()});
    alert("✅ Publié ! Visible dans 195 pays !"); e.target.reset(); document.getElementById("modal").classList.remove("active");
  }catch(err){alert("Erreur: "+err.message);}
  btn.disabled=false; btn.textContent="🚀 PUBLIER DANS 195 PAYS";
});
render();
</script></body></html>
