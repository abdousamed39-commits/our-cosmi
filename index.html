<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Our Cosmi WORLD</title><style>
:root{--bg:#FAF8F5;--paper:#FFF;--ink:#141414;--gold:#B89B5E;--line:#EDE8E0}
*{margin:0;box-sizing:border-box}body{background:var(--bg);font-family:Poppins,Arial}
header{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--gold)}
.logo{font-weight:900;letter-spacing:1.5px;font-size:18px}.logo b{color:var(--gold)}.logo i{font-weight:300;opacity:.8;font-size:11px;letter-spacing:3px;margin-left:8px}
header input,header select{background:#1E1E1E;border:1px solid #2A2A2A;color:#fff;border-radius:30px;padding:10px 14px;font-size:12px}
header input{flex:1;min-width:140px}
.hero{background:linear-gradient(180deg,#141414,#2A2220);color:#fff;text-align:center;padding:38px 20px}
.hero h1{font-size:28px;font-weight:300;letter-spacing:2px}.hero h1 span{font-weight:700;color:var(--gold)}.hero p{color:#E8DCC2;font-size:12px;margin-top:6px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:50}
.fbtn{white-space:nowrap;border-radius:30px;padding:8px 18px;border:1px solid var(--line);background:#fff;font-size:12px}.fbtn.active{background:var(--ink);color:var(--gold)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;padding:16px;min-height:300px}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.card img{width:100%;height:200px;object-fit:cover;background:#f5f5f5}
.card-body{padding:12px 14px}.cat{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.title{font-size:13px;font-weight:600;margin:4px 0;height:36px;overflow:hidden;line-height:18px}.vendor{font-size:10px;color:#999}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font-weight:800;font-size:13px}.wa{background:var(--ink);color:var(--gold);border:1px solid var(--ink);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600}
.fab{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--gold);width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);font-size:28px;z-index:90}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}.modal.active{display:flex}
.box{background:var(--bg);width:100%;max-width:420px;border-radius:24px;padding:20px;border:1px solid var(--line);max-height:92vh;overflow:auto}
.box input,.box select{width:100%;margin:6px 0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px}
.box button[type=submit]{width:100%;background:var(--ink);color:var(--gold);border:none;padding:14px;border-radius:14px;font-weight:700;margin-top:8px}
</style></head><body>
<header><div class="logo">OUR <b>COSMI</b> <i>WORLD</i></div><input id="search" placeholder="Perruque, crème, parfum..."><select id="countryFilter"><option value="all">🌍 Tous pays</option></select><select id="contFilter"><option value="all">🌍 Monde</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></header>
<div class="hero"><h1>195 PAYS. <span>UNE BEAUTÉ.</span></h1><p>VERA COSMIQUE • De Nouakchott à Paris • Dubaï • New York</p></div>
<div class="filters"><button class="fbtn active" data-cat="all">Tout</button><button class="fbtn" data-cat="Perruque">Perruques</button><button class="fbtn" data-cat="Crème">Crèmes</button><button class="fbtn" data-cat="Naturel">Naturel</button><button class="fbtn" data-cat="Parfum">Parfums</button><button class="fbtn" data-cat="Maquillage">Makeup</button></div>
<div class="products" id="grid"></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="box"><h3>DEVENIR VENDEUSE</h3><form id="form"><input id="pName" placeholder="Nom produit" required><input id="pPrice" type="number" placeholder="Prix" required><select id="pCurrency" required><option>MRU</option><option>EUR €</option><option>USD $</option><option>AED</option><option>XOF</option><option>MAD</option></select><select id="pCat" required><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option><option>Naturel</option></select><select id="pCountry" required></select><input id="pVendor" placeholder="Nom boutique" required><input id="pWa" placeholder="WhatsApp +222..." required><input id="pImg" placeholder="Lien photo"><button type="submit">PUBLIER ✈️</button><button type="button" id="close" style="width:100%;background:transparent;border:1px solid #EDE8E0;padding:12px;border-radius:14px;margin-top:8px">Annuler</button></form></div></div>
<script>
localStorage.clear();
const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"Nigeria",flag:"🇳🇬",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"Espagne",flag:"🇪🇸",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Brésil",flag:"🇧🇷",cont:"Amérique"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"}];
const KEY="FIX_V51_18_PRODUITS";
const defaults=[
{name:"VERA COSMIQUE Aloe Vera Serum 250ml",price:"1200 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22246123456",img:"https://images.unsplash.com/photo-1608571423902-eed4a94d8108?w=400"},
{name:"VERA COSMIQUE Aloe Vera Luxe 500ml",price:"2100 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22246123456",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},
{name:"VERA COSMIQUE Nourish & Repair Duo",price:"3000 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22246123456",img:"https://images.unsplash.com/photo-1617897903246-719242758050?w=400"},
{name:"Perruque Brésilienne 22\"",price:"4500 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou NKC",wa:"22246123456",img:"https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400"},
{name:"Crème Teint Diamant",price:"45 €",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},
{name:"Parfum Oud Dubaï",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"},
{name:"Perruque Lace Frontal 18\"",price:"3800 MRU",cat:"Perruque",country:"Sénégal",flag:"🇸🇳",vendor:"Mariam Dakar",wa:"221771234567",img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400"},
{name:"Huile Argan Pure Maroc",price:"250 MAD",cat:"Crème",country:"Maroc",flag:"🇲🇦",vendor:"Leila Marrakech",wa:"212612345678",img:"https://images.unsplash.com/photo-1608571423902-eed4a94d8108?w=400"},
{name:"Rouge à Lèvres Matte Velvet",price:"28 €",cat:"Maquillage",country:"France",flag:"🇫🇷",vendor:"Belle Paris",wa:"33698765432",img:"https://images.unsplash.com/photo-1586495777744-4413f21062fa?w=400"},
{name:"Perruque Afro Curly 20\"",price:"5200 MRU",cat:"Perruque",country:"Nigeria",flag:"🇳🇬",vendor:"Chioma Lagos",wa:"2348012345678",img:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=400"},
{name:"Fond de Teint Invisible HD",price:"32 $",cat:"Maquillage",country:"USA",flag:"🇺🇸",vendor:"Glow NY",wa:"12125551234",img:"https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=400"},
{name:"Parfum Chanel N°5",price:"95 €",cat:"Parfum",country:"France",flag:"🇫🇷",vendor:"Chic Paris",wa:"33611223344",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"},
{name:"Crème Hydra Rose",price:"1800 MRU",cat:"Crème",country:"Mauritanie",flag:"🇲🇷",vendor:"Our Cosmi",wa:"22246123456",img:"https://images.unsplash.com/photo-1617897903246-719242758050?w=400"},
{name:"Mascara Volume Noir",price:"22 €",cat:"Maquillage",country:"Espagne",flag:"🇪🇸",vendor:"Luna Madrid",wa:"34911223344",img:"https://images.unsplash.com/photo-1631214524020-7e84f0d84a6c?w=400"},
{name:"Savon Noir Naturel",price:"900 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"Bio NKC",wa:"22247123456",img:"https://images.unsplash.com/photo-1600857544200-b2f666a9a2ec?w=400"},
{name:"Perruque Blonde 24\"",price:"6500 MRU",cat:"Perruque",country:"Brésil",flag:"🇧🇷",vendor:"Samba Hair",wa:"5511987654321",img:"https://images.unsplash.com/photo-1500917293891-ef795e70e1f6?w=400"},
{name:"Parfum Musc Blanc Dubaï",price:"150 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Noor Dubai",wa:"971501111222",img:"https://images.unsplash.com/photo-1594035910387-fea47794261f?w=400"},
{name:"Palette Maquillage Nude",price:"55 $",cat:"Maquillage",country:"USA",flag:"🇺🇸",vendor:"Glam LA",wa:"13105551234",img:"https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=400"}
];
let items=defaults;
const cf=document.getElementById("countryFilter"),pC=document.getElementById("pCountry");
function fill(){const o='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');cf.innerHTML=o;if(pC){pC.innerHTML='<option value="">Ton pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');}}
let activeCat="all";const grid=document.getElementById("grid");
function render(){grid.innerHTML="";const term=(document.getElementById("search")?.value||"").toLowerCase(),cval=cf.value,cont=document.getElementById("contFilter").value;items.filter(i=>{const mCat=activeCat==="all"||i.cat===activeCat;const mSearch=i.name.toLowerCase().includes(term);const mCountry=cval==="all"||i.country===cval;const w=WORLD.find(x=>x.name===i.country);const mCont=cont==="all"||cont==="🌍 Monde"||(w&&w.cont===cont);return mCat&&mSearch&&mCountry&&mCont;}).forEach(p=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${p.img}"><div class="card-body"><div class="cat">${p.flag} ${p.cat} • ${p.country}</div><div class="title">${p.name}</div><div class="vendor">${p.vendor}</div><div class="bottom"><div class="price">${p.price}</div><button class="wa" onclick="window.open('https://wa.me/${p.wa}','_blank')">WhatsApp</button></div></div>`;grid.appendChild(d);});}
fill();document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render();}));
cf.addEventListener("change",render);document.getElementById("contFilter").addEventListener("change",render);document.getElementById("search")?.addEventListener("input",render);
document.getElementById("fab").onclick=()=>document.getElementById("modal").classList.add("active");document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("active");
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const cName=pC.value;const obj=WORLD.find(x=>x.name===cName)||{flag:"🌍"};items.unshift({name:pName.value,price:document.getElementById("pPrice").value+" "+document.getElementById("pCurrency").value,country:cName,flag:obj.flag,cat:document.getElementById("pCat").value,vendor:document.getElementById("pVendor").value,wa:document.getElementById("pWa").value.replace(/\s|\+/g,''),img:document.getElementById("pImg").value||defaults[0].img});render();e.target.reset();document.getElementById("modal").classList.remove("active");});
render();
</script></body></html>
