<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cosmi WORLD - 195 Pays</title>
<style>
:root{--bg:#FAF8F5;--paper:#FFF;--ink:#141414;--gold:#B89B5E;--line:#EDE8E0}
*{margin:0;box-sizing:border-box}body{background:var(--bg);font-family:Arial}
header{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.logo{font-weight:900;font-size:18px}.logo b{color:var(--gold)}
header input,header select{background:#1E1E1E;border:1px solid #333;color:#fff;border-radius:30px;padding:10px 14px;font-size:12px}
header input{flex:1;min-width:120px}
.hero{background:#141414;color:#fff;text-align:center;padding:32px 20px}
.hero h1{font-size:26px;font-weight:300}.hero h1 span{font-weight:700;color:var(--gold)}
.hero p{margin-top:8px;color:#E8DCC2;font-size:11px;letter-spacing:1px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:50}
.fbtn{white-space:nowrap;border-radius:30px;padding:8px 16px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer}.fbtn.active{background:var(--ink);color:var(--gold)}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.card img{width:100%;height:170px;object-fit:cover;display:block;background:#eee}
.card-body{padding:10px 12px}.cat{font-size:8px;color:var(--gold);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.title{font-size:12px;font-weight:600;margin:4px 0;height:32px;overflow:hidden}
.vendor{font-size:10px;color:#999}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:800;font-size:12px}.wa{background:var(--ink);color:var(--gold);border:none;padding:6px 10px;border-radius:20px;font-size:10px}
.fab{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--gold);width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);font-size:28px;z-index:90}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}.modal.active{display:flex}
.box{background:#FAF8F5;width:100%;max-width:400px;border-radius:20px;padding:18px;max-height:90vh;overflow:auto}
.box input,.box select{width:100%;margin:5px 0;padding:11px;border-radius:12px;border:1px solid var(--line)}
.box button[type=submit]{width:100%;background:var(--ink);color:var(--gold);border:none;padding:13px;border-radius:12px;font-weight:700;margin-top:8px}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyAJQMIVjOA8TrQw9RDvWr_tuKbzVtaSS0I",authDomain:"our-cosmi-world.firebaseapp.com",projectId:"our-cosmi-world",storageBucket:"our-cosmi-world.firebasestorage.app",messagingSenderId:"363231617261",appId:"1:363231617261:web:53a5cb6ef59b98a0a8ece4"};
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);
window.db=db; window.collection=collection; window.addDoc=addDoc; window.onSnapshot=onSnapshot; window.query=query; window.orderBy=orderBy; window.serverTimestamp=serverTimestamp;
</script>
</head>
<body>
<header><div class="logo">OUR <b>COSMI</b> WORLD</div><input id="search" placeholder="Chercher..."><select id="countryFilter"></select><select id="contFilter"><option value="all">🌍 Monde</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></header>
<div class="hero"><h1>195 PAYS. <span>UNE BEAUTÉ.</span></h1><p>VERA COSMIQUE • NOUAKCHOTT - PARIS - DUBAÏ - NEW YORK</p></div>
<div class="filters"><button class="fbtn active" data-cat="all">Tout</button><button class="fbtn" data-cat="Perruque">Perruques</button><button class="fbtn" data-cat="Crème">Crèmes</button><button class="fbtn" data-cat="Naturel">VERA</button><button class="fbtn" data-cat="Parfum">Parfums</button><button class="fbtn" data-cat="Maquillage">Makeup</button></div>
<div class="products" id="grid"></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="box"><h3 style="font-weight:900;margin-bottom:10px">Publier - 195 Pays</h3><form id="form"><input id="pName" placeholder="Nom produit *" required><input id="pPrice" type="number" placeholder="Prix *" required><select id="pCurrency"><option>MRU</option><option>EUR €</option><option>USD $</option><option>AED</option><option>MAD</option></select><select id="pCat" required><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option><option>Naturel</option></select><select id="pCountry" required></select><input id="pVendor" placeholder="Ta boutique *" required><input id="pWa" placeholder="WhatsApp +222... *" required><input id="pImg" placeholder="Lien photo (facultatif)"><button type="submit" id="submitBtn">🚀 PUBLIER</button><button type="button" id="close" style="width:100%;background:transparent;border:1px solid #EDE8E0;padding:10px;border-radius:12px;margin-top:8px">Annuler</button></form></div></div>
<script type="module">
const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"Nigeria",flag:"🇳🇬",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"Espagne",flag:"🇪🇸",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Brésil",flag:"🇧🇷",cont:"Amérique"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"}];
const defaults=[
{name:"VERA COSMIQUE Serum 250ml",price:"120 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22241176023",img:"https://picsum.photos/seed/vera1/400/400"},
{name:"VERA COSMIQUE Luxe 500ml",price:"210 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22241176023",img:"https://picsum.photos/seed/vera2/400/400"},
{name:"VERA COSMIQUE Duo Repair",price:"300 MRU",cat:"Naturel",country:"Mauritanie",flag:"🇲🇷",vendor:"VERA COSMIQUE",wa:"22241176023",img:"https://picsum.photos/seed/vera3/400/400"},
{name:"Perruque Brésilienne 22\"",price:"4500 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou NKC",wa:"22246123456",img:"https://picsum.photos/seed/p1/400/400"},
{name:"Crème Teint Diamant",price:"45 €",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:"https://picsum.photos/seed/c1/400/400"},
{name:"Parfum Oud Dubaï",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:"https://picsum.photos/seed/parf1/400/400"},
{name:"Perruque Lace 18\"",price:"3800 MRU",cat:"Perruque",country:"Sénégal",flag:"🇸🇳",vendor:"Mariam Dakar",wa:"221771234567",img:"https://picsum.photos/seed/p2/400/400"},
{name:"Huile Argan Maroc",price:"250 MAD",cat:"Crème",country:"Maroc",flag:"🇲🇦",vendor:"Leila",wa:"212612345678",img:"https://picsum.photos/seed/argan1/400/400"},
{name:"Rouge Velvet",price:"28 €",cat:"Maquillage",country:"France",flag:"🇫🇷",vendor:"Belle Paris",wa:"33698765432",img:"https://picsum.photos/seed/lip1/400/400"},
{name:"Perruque Afro 20\"",price:"5200 MRU",cat:"Perruque",country:"Nigeria",flag:"🇳🇬",vendor:"Chioma Lagos",wa:"2348012345678",img:"https://picsum.photos/seed/afro1/400/400"},
{name:"Fond de Teint HD",price:"32 $",cat:"Maquillage",country:"USA",flag:"🇺🇸",vendor:"Glow NY",wa:"12125551234",img:"https://picsum.photos/seed/fond1/400/400"},
{name:"Parfum Chanel N°5",price:"95 €",cat:"Parfum",country:"France",flag:"🇫🇷",vendor:"Chic Paris",wa:"33611223344",img:"https://picsum.photos/seed/ch1/400/400"},
{name:"Crème Hydra Rose",price:"1800 MRU",cat:"Crème",country:"Mauritanie",flag:"🇲🇷",vendor:"Our Cosmi",wa:"22246123456",img:"https://picsum.photos/seed/rose1/400/400"},
{name:"Mascara Volume",price:"22 €",cat:"Maquillage",country:"Espagne",flag:"🇪🇸",vendor:"Luna Madrid",wa:"34911223344",img:"https://picsum.photos/seed/masc1/400/400"},
{name:"Savon Noir Naturel",price:"900 MRU",cat:"Crème",country:"Mauritanie",flag:"🇲🇷",vendor:"Bio NKC",wa:"22247123456",img:"https://picsum.photos/seed/savon1/400/400"},
{name:"Perruque Blonde 24\"",price:"6500 MRU",cat:"Perruque",country:"Brésil",flag:"🇧🇷",vendor:"Samba Hair",wa:"5511987654321",img:"https://picsum.photos/seed/blond1/400/400"},
{name:"Parfum Musc Blanc",price:"150 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Noor Dubai",wa:"971501111222",img:"https://picsum.photos/seed/musc1/400/400"},
{name:"Palette Nude",price:"55 $",cat:"Maquillage",country:"USA",flag:"🇺🇸",vendor:"Glam LA",wa:"13105551234",img:"https://picsum.photos/seed/pal1/400/400"}
];
const cf=document.getElementById("countryFilter"),pC=document.getElementById("pCountry");
function fill(){const o='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');cf.innerHTML=o;pC.innerHTML=WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');}
let activeCat="all"; const grid=document.getElementById("grid"); let fb=[];
const productsCol = collection(db,"products");
const q = query(productsCol, orderBy("createdAt","desc"));
onSnapshot(q,(snap)=>{
  fb=[];
  snap.forEach(d=>{let x=d.data(); fb.push({name:x.name,price:(x.price||0)+" "+(x.currency||"MRU"),cat:x.category,country:x.country,flag:WORLD.find(w=>w.name==x.country)?.flag||"🌍",vendor:x.desc||"Boutique",wa:x.whatsapp,img:x.image||"https://picsum.photos/seed/fb"+Math.random()+"/400/400"})});
  render();
},(err)=>{ console.log("Firebase offline, mode demo"); render(); });

function getAll(){ if(fb.length===0) return defaults; return [...fb, ...defaults]; }

function render(){
  grid.innerHTML=""; const term=document.getElementById("search").value.toLowerCase(),cval=cf.value,cont=document.getElementById("contFilter").value;
  getAll().filter(i=>{const mCat=activeCat==="all"||i.cat===activeCat;const mSearch=i.name.toLowerCase().includes(term);const mCountry=cval==="all"||i.country===cval;const w=WORLD.find(x=>x.name===i.country);const mCont=cont==="all"||cont==="🌍 Monde"||(w&&w.cont===cont);return mCat&&mSearch&&mCountry&&mCont;}).forEach(p=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<img src="${p.img}" onerror="this.onerror=null;this.src='https://picsum.photos/seed/fallback${Math.floor(Math.random()*100)}/400/400'"><div class="card-body"><div class="cat">${p.flag} ${p.cat} • ${p.country}</div><div class="title">${p.name}</div><div class="vendor">${p.vendor}</div><div class="bottom"><div class="price">${p.price}</div><button class="wa" onclick="window.open('https://wa.me/${p.wa}','_blank')">WhatsApp</button></div></div>`;
    grid.appendChild(d);
  });
}
fill();
document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render();}));
cf.addEventListener("change",render);document.getElementById("contFilter").addEventListener("change",render);document.getElementById("search").addEventListener("input",render);
document.getElementById("fab").onclick=()=>document.getElementById("modal").classList.add("active");document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("active");
document.getElementById("form").addEventListener("submit",async(e)=>{
  e.preventDefault(); const btn=document.getElementById("submitBtn"); btn.disabled=true; btn.textContent="Publication...";
  try{
    await addDoc(productsCol,{name:document.getElementById("pName").value,price:Number(document.getElementById("pPrice").value),currency:document.getElementById("pCurrency").value,country:pC.value,category:document.getElementById("pCat").value,image:document.getElementById("pImg").value,whatsapp:document.getElementById("pWa").value,desc:document.getElementById("pVendor").value,createdAt:serverTimestamp()});
    alert("✅ Publié dans 195 pays !"); e.target.reset(); document.getElementById("modal").classList.remove("active");
  }catch(err){alert("Erreur: "+err.message);}
  btn.disabled=false; btn.textContent="🚀 PUBLIER";
});
render();
</script></body></html>
