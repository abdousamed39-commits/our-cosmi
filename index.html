<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Cosmi WORLD - 195 Pays</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#FAF8F5;--paper:#FFFFFF;--ink:#141414;--gold:#B89B5E;--gold2:#E8DCC2;--line:#EDE8E0;--rose:#C77A8A}
*{margin:0;box-sizing:border-box}body{background:var(--bg);color:var(--ink);font-family:'Poppins',Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:100;background:var(--ink);color:#fff;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-bottom:1px solid var(--gold)}
.logo{font-weight:900;letter-spacing:1.5px;font-size:18px}.logo b{color:var(--gold)}.logo i{font-style:normal;font-weight:300;opacity:.8;font-size:12px;letter-spacing:3px;margin-left:8px}
header input,header select{background:#1E1E1E;border:1px solid #2A2A2A;color:#fff;border-radius:30px;padding:10px 14px;font-size:12px;outline:none}
header input{flex:1;min-width:140px}header input::placeholder{color:#888}
.hero{background:linear-gradient(180deg,#141414 0%, #2A2220 100%);color:#fff;text-align:center;padding:38px 20px 32px;position:relative}
.hero h1{font-size:28px;letter-spacing:2px;font-weight:300;margin:0}.hero h1 span{font-weight:700;color:var(--gold)}
.hero p{margin-top:8px;color:var(--gold2);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.filters{display:flex;gap:8px;overflow-x:auto;padding:16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:50}
.fbtn{white-space:nowrap;border-radius:30px;padding:8px 18px;border:1px solid var(--line);background:var(--paper);font-size:12px;letter-spacing:.5px;cursor:pointer;transition:.2s}.fbtn.active{background:var(--ink);color:var(--gold);border-color:var(--ink)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;padding:16px}
.card{background:var(--paper);border-radius:20px;overflow:hidden;border:1px solid var(--line);transition:.3s;box-shadow:0 4px 20px rgba(20,20,20,.04)}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,20,20,.08)}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:12px 14px 14px}
.cat{font-size:8px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.title{font-size:13px;font-weight:600;margin:4px 0;height:36px;overflow:hidden;line-height:18px}
.vendor{font-size:10px;color:#999;margin-top:2px}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-weight:800;font-size:13px;letter-spacing:.3px}
.wa{background:var(--ink);color:var(--gold);border:1px solid var(--ink);padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer}
.wa:hover{background:var(--gold);color:var(--ink)}
.fab{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--gold);width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);font-size:28px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(20,20,20,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}.modal.active{display:flex}
.box{background:var(--bg);width:100%;max-width:420px;border-radius:24px;padding:20px;border:1px solid var(--line);max-height:92vh;overflow:auto}
.box h3{text-align:center;letter-spacing:1px;font-weight:400;margin-bottom:12px}.box input,.box select{width:100%;margin:6px 0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px}
.box button[type=submit]{width:100%;background:var(--ink);color:var(--gold);border:none;padding:14px;border-radius:14px;font-weight:700;letter-spacing:1px;margin-top:8px}
</style></head><body>
<header><div class="logo">OUR <b>COSMI</b> <i>WORLD</i></div><input id="search" placeholder="Perruque, crème, parfum..."><select id="countryFilter"></select><select id="contFilter"><option value="all">🌍 Monde</option><option>Afrique</option><option>Europe</option><option>Asie</option><option>Amérique</option></select></header>
<div class="hero"><h1>195 PAYS. <span>UNE BEAUTÉ.</span></h1><p>De Nouakchott à Paris • Dubaï • New York</p></div>
<div class="filters"><button class="fbtn active" data-cat="all">Tout</button><button class="fbtn" data-cat="Perruque">Perruques</button><button class="fbtn" data-cat="Crème">Crèmes</button><button class="fbtn" data-cat="Parfum">Parfums</button><button class="fbtn" data-cat="Maquillage">Makeup</button></div>
<div class="products" id="grid"></div>
<button class="fab" id="fab">+</button>
<div class="modal" id="modal"><div class="box"><h3>DEVENIR VENDEUSE</h3><form id="form"><input id="pName" placeholder="Nom produit" required><input id="pPrice" type="number" placeholder="Prix" required><select id="pCurrency" required><option>MRU</option><option>EUR €</option><option>USD $</option><option>AED</option><option>XOF</option><option>MAD</option></select><select id="pCat" required><option>Perruque</option><option>Crème</option><option>Parfum</option><option>Maquillage</option></select><select id="pCountry" required></select><input id="pVendor" placeholder="Nom boutique" required><input id="pWa" placeholder="WhatsApp +222..." required><input id="pImg" placeholder="Lien photo"><button type="submit">PUBLIER ✈️</button><button type="button" id="close" style="width:100%;background:transparent;border:1px solid var(--line);padding:12px;border-radius:14px;margin-top:8px">Annuler</button></form></div></div>
<script>
const WORLD=[{name:"Mauritanie",flag:"🇲🇷",cont:"Afrique"},{name:"Sénégal",flag:"🇸🇳",cont:"Afrique"},{name:"Mali",flag:"🇲🇱",cont:"Afrique"},{name:"Côte d'Ivoire",flag:"🇨🇮",cont:"Afrique"},{name:"Nigeria",flag:"🇳🇬",cont:"Afrique"},{name:"Maroc",flag:"🇲🇦",cont:"Afrique"},{name:"France",flag:"🇫🇷",cont:"Europe"},{name:"Espagne",flag:"🇪🇸",cont:"Europe"},{name:"UK",flag:"🇬🇧",cont:"Europe"},{name:"USA",flag:"🇺🇸",cont:"Amérique"},{name:"Canada",flag:"🇨🇦",cont:"Amérique"},{name:"Brésil",flag:"🇧🇷",cont:"Amérique"},{name:"Dubaï",flag:"🇦🇪",cont:"Asie"},{name:"Turquie",flag:"🇹🇷",cont:"Asie"},{name:"Chine",flag:"🇨🇳",cont:"Asie"}];
const KEY="cosmi_world_final";const defaults=[{name:"Perruque Brésilienne 22\"",price:"4500 MRU",cat:"Perruque",country:"Mauritanie",flag:"🇲🇷",vendor:"Fatou NKC",wa:"22246123456",img:"https://images.unsplash.com/photo-1590156546946-ce55a12a6a5d?w=400"},{name:"Crème Teint Diamant",price:"45 €",cat:"Crème",country:"France",flag:"🇫🇷",vendor:"Aïcha Paris",wa:"33612345678",img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?w=400"},{name:"Parfum Oud Dubaï",price:"120 AED",cat:"Parfum",country:"Dubaï",flag:"🇦🇪",vendor:"Zahra Dubai",wa:"971501234567",img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=400"}];
let items=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;const cf=document.getElementById("countryFilter"),pC=document.getElementById("pCountry");
function fill(){const o='<option value="all">🌍 Tous pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');cf.innerHTML=o;pC.innerHTML='<option value="">Ton pays</option>'+WORLD.map(w=>`<option value="${w.name}">${w.flag} ${w.name}</option>`).join('');}
let activeCat="all";const grid=document.getElementById("grid");
function render(){grid.innerHTML="";const term=document.getElementById("search").value.toLowerCase(),cval=cf.value,cont=document.getElementById("contFilter").value;items.filter(i=>{const mCat=activeCat==="all"||i.cat===activeCat;const mSearch=i.name.toLowerCase().includes(term);const mCountry=cval==="all"||i.country===cval;const w=WORLD.find(x=>x.name===i.country);const mCont=cont==="all"||cont==="🌍 Monde"||(w&&w.cont===cont);return mCat&&mSearch&&mCountry&&mCont;}).forEach(p=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<img src="${p.img}"><div class="card-body"><div class="cat">${p.flag} ${p.cat} • ${p.country}</div><div class="title">${p.name}</div><div class="vendor">${p.vendor}</div><div class="bottom"><div class="price">${p.price}</div><button class="wa" onclick="window.open('https://wa.me/${p.wa}','_blank')">WhatsApp</button></div></div>`;grid.appendChild(d);});localStorage.setItem(KEY,JSON.stringify(items));}
fill();document.querySelectorAll(".fbtn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("active"));b.classList.add("active");activeCat=b.dataset.cat;render();}));
cf.addEventListener("change",render);document.getElementById("contFilter").addEventListener("change",render);document.getElementById("search").addEventListener("input",render);
document.getElementById("fab").onclick=()=>document.getElementById("modal").classList.add("active");document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("active");
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const cName=pC.value;const obj=WORLD.find(x=>x.name===cName)||{flag:"🌍"};items.unshift({name:pName.value,price:document.getElementById("pPrice").value+" "+document.getElementById("pCurrency").value,country:cName,flag:obj.flag,cat:document.getElementById("pCat").value,vendor:document.getElementById("pVendor").value,wa:document.getElementById("pWa").value.replace(/\s|\+/g,''),img:document.getElementById("pImg").value||defaults[0].img});render();e.target.reset();document.getElementById("modal").classList.remove("active");});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script></body></html>
